name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: 

env:
  CARGO_TERM_COLOR: always

jobs:


  windows_x64:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      working-directory: src-tauri
      run: cargo test --verbose

  linux_x64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      working-directory: src-tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev
        cargo test --verbose
  
  linux_arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      working-directory: src-tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev
        cargo test --verbose

  macOS_intel:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      working-directory: src-tauri
      run: cargo test --verbose

  macOS_arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      working-directory: src-tauri
      run: cargo test --verbose

